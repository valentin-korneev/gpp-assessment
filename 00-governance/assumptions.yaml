assumptions:
  - id: ASM-SCOPE-001
    area: scope
    statement_ru: >-
      До уточнения системной границы GPP рассматривается как центральная платежная/integration platform,
      а банки, небанковские поставщики платежных услуг, государственные органы, поставщики массовых услуг
      и иные подключенные организации - как внешние участники, если последующие sources не показывают иное.
    confidence: tentative
    status: active
    reason_ru: >-
      Публичные источники описывают GPP как единую/централизованную платформу и перечисляют подключенные
      организации и каналы, но не задают формальную архитектурную boundary.
    related_questions:
      - Q-SCOPE-001
