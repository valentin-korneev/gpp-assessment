- id: Q-DB-004
  area: database-constraints-and-enums
  question_ru: Какие ограничения PK/UK/FK, индексы и enum mappings реально применялись или применяются для 
    документированных таблиц, в частности MESSAGE.OUTBOUND и PAYMENT_DATA.EPMT_STATE_CODE?
  reason_ru: Источник явно показывает лишь часть foreign keys, часто описывает ID как unique/key без типа ограничения, а
    два описания enum содержат внутренние коллизии. Для точной физической модели нужен DDL или системный каталог.
  priority: important
  status: resolved
  related_sources:
  - SRC-DB-001
  related_evidence:
  - EV-DB-003
  - EV-DB-009
  - EV-DB-010
  resolution_ru: Ожидать отдельного подтверждения полного DDL/constraints нецелесообразно. В physical model сохраняются 
    только явно документированные PK/FK; для остальных связей введен отдельный registry logical-foreign-keys.yaml с FACT
    и INFERENCE связями и confidence. Эти связи не повышаются до Oracle constraints. Неоднозначные enum mappings 
    остаются contradictions, а не вопросами.
  stakeholder_context_ru: На 17.08.2026 stakeholder указал, что существенно более полной документации по БД не ожидается
    и логические FK следует восстанавливать аналитически и явно фиксировать в модели.
  related_model_artifacts:
  - 02-as-is/normalized/data/logical-foreign-keys.yaml
  - 02-as-is/normalized/data/cf-transaction-db.mmd
