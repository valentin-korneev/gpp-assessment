questions:
- id: Q-SCOPE-001
  area: scope
  question_ru: Где проходит подтвержденная системная граница GPP относительно банков, PSP, государственных органов,
    поставщиков массовых услуг и иных подключенных систем?
  reason_ru: Boundary влияет на component/context model, ownership и классификацию interfaces.
  priority: important
  status: resolved
  related_assumptions:
  - ASM-SCOPE-001
  resolution_ru: Для рабочей AS-IS boundary именованные infrastructure modules из функциональной спецификации считаются
    внутренними элементами GPP, а participant organizations и внешние payment/settlement systems - внешними сторонами.
    Неназванные внутренние core components остаются отдельной неизвестностью Q-ARCH-001.
  related_sources:
  - SRC-FS-001
  - SRC-FS-002

- id: Q-VND-001
  area: vendor-ownership
  question_ru: Какова текущая роль SINAM в сопровождении, развитии или эксплуатации GPP?
  reason_ru: Публичный сайт SINAM подтверждает историческое участие в разработке, но не подтверждает текущую роль.
    Ожидается отдельный документ по сопровождению, который должен иметь более высокий приоритет для ответа.
  priority: important
  status: open
  related_sources:
  - SRC-PUB-004

- id: Q-SRC-001
  area: source-versioning
  question_ru: Являются ли SRC-FS-001 и SRC-FS-002 независимыми рабочими документами или редакциями одной версии,
    и какая редакция authoritative/current?
  reason_ru: Внутренняя metadata совпадает. Stakeholder сообщает, что DOCX v005 был передан позже и является более
    полным, но это не доказывает version authority и допускает независимое происхождение документов.
  priority: important
  status: open
  related_sources:
  - SRC-FS-001
  - SRC-FS-002
  - SRC-STK-001
  stakeholder_context_ru: DOCX filename v005 был передан позже PDF и воспринимается как более полный; возможная
    независимость документов остается рабочей гипотезой.

- id: Q-ARCH-001
  area: architecture
  question_ru: Какие компоненты реализуют центральную обработку платежей, состояние счетов/инвойсов и persistence,
    если они не названы в перечне infrastructure modules?
  reason_ru: Система как целое принимает и обрабатывает платежи, но функциональная спецификация перечисляет преимущественно
    channels, integration и administration modules, не называя core processing/storage components.
  priority: important
  status: open
  related_facts:
  - FACT-GPP-008

- id: Q-CUR-001
  area: currentness
  question_ru: Какие из модулей, описанных функциональной спецификацией 05.05.2023, остаются в текущем production
    state и в каком виде?
  reason_ru: WebPortal и mobile app уже подтвержденно прекращены в 2024 году; для остальных модулей актуальность
    после даты спецификации пока не подтверждена.
  priority: important
  status: open
  related_sources:
  - SRC-FS-001
  - SRC-FS-002
  related_facts:
  - FACT-GPP-003
  - FACT-GPP-008

- id: Q-EXT-001
  area: external-systems
  question_ru: Обозначают ли XÖHK и XÖHKS одну внешнюю систему?
  reason_ru: Разные написания встречаются в описании Loader Generators и LVPCSS и влияют на нормализацию context/interface
    model.
  priority: important
  status: resolved
  resolution_ru: Да. По stakeholder confirmation XÖHK является опечаткой и должен нормализоваться как XÖHKS.
  related_evidence:
  - EV-STK-002
  related_facts:
  - FACT-GPP-016

- id: Q-EXT-002
  area: external-systems
  question_ru: Следует ли IAMAS и AVIS считать внешними системами GPP?
  reason_ru: Спецификация использует их как identification Source, но формальная system boundary не описана.
  priority: important
  status: resolved
  resolution_ru: В рабочей AS-IS модели считать IAMAS и AVIS внешними системами до получения обратного подтверждения;
    классификация остается tentative через ASM-EXT-001.
  related_assumptions:
  - ASM-EXT-001
  related_sources:
  - SRC-FS-001
  - SRC-FS-002
  - SRC-STK-001

- id: Q-ID-001
