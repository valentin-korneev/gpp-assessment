  - FACT-GPP-071
- id: Q-SEC-001
  area: security-access
  question_ru: Как устроены текущие authentication/authorization и segregation-of-duties для 
    system/security/certificate, participant administrators и operators, включая использование электронных сертификатов,
    MFA и emergency credential handling?
  reason_ru: Правила 2015 года задают доступ по сертификату и имени пользователя/паролю и раздельные операционные роли, 
    а спецификация 2023 года подтверждает разрешения, двойную авторизацию и измененный набор административных ролей. 
    Текущая модель контроля безопасности и сохранение исторических механизмов не подтверждены. Технический источник BDA 
    2025 дополнительно подтверждает локальный вход по имени пользователя/паролю, JWT authorities и хранение паролей в 
    виде bcrypt-хэшей, но не описывает полный механизм передачи и жизненный цикл токена, MFA или корпоративное 
    разделение обязанностей.
  priority: important
  status: open
  related_sources:
