    связаны с конкретным identification type?'
  reason_ru: Reviewer comments указывают на дублирование configuration и риск ошибок при раздельных properties.
    Более актуального подтверждения пока нет.
  priority: important
  status: open
  related_evidence:
  - EV-FS-020

