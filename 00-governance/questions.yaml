questions:
- id: Q-SCOPE-001
  area: scope
  question_ru: Где проходит подтвержденная системная граница GPP относительно банков, PSP, государственных органов, 
    поставщиков массовых услуг и иных подключенных систем?
  reason_ru: Boundary влияет на component/context model, ownership и классификацию interfaces.
  priority: important
  status: resolved
  related_assumptions:
  - ASM-SCOPE-001
  resolution_ru: Для рабочей AS-IS boundary именованные infrastructure modules из функциональной спецификации считаются 
    внутренними элементами GPP, а participant organizations и внешние payment/settlement systems - внешними сторонами. 
    Неназванные внутренние core components остаются отдельной неизвестностью Q-ARCH-001.
  related_sources:
  - SRC-FS-001
  - SRC-FS-002
- id: Q-VND-001
  area: vendor-ownership
  question_ru: Какова текущая роль SINAM в сопровождении, развитии или эксплуатации GPP?
  reason_ru: Публичный сайт SINAM подтверждает историческую разработку GPP и отдельно проект AniPay для CBA в 2022-2024 с
    требованием интеграции GPP, но не подтверждает сопровождение, развитие или эксплуатацию самого GPP после 2024 года.
  priority: important
  status: open
  related_sources:
  - SRC-PUB-004
  - SRC-PUB-007
  related_facts:
  - FACT-GPP-005
  - FACT-GPP-073
- id: Q-SRC-001
  area: source-versioning
  question_ru: Являются ли SRC-FS-001 и SRC-FS-002 независимыми рабочими документами или редакциями одной версии, и 
    какая редакция authoritative/current?
  reason_ru: Внутренняя metadata совпадает. Stakeholder сообщает, что DOCX v005 был передан позже и является более 
    полным, но это не доказывает version authority и допускает независимое происхождение документов.
  priority: important
  status: open
  related_sources:
  - SRC-FS-001
  - SRC-FS-002
  - SRC-STK-001
  stakeholder_context_ru: DOCX filename v005 был передан позже PDF и воспринимается как более полный; возможная 
    независимость документов остается рабочей гипотезой.
- id: Q-ARCH-001
  area: architecture
  question_ru: Какие компоненты реализуют центральную обработку платежей, состояние счетов/инвойсов и persistence, если 
    они не названы в перечне infrastructure modules?
  reason_ru: Система как целое принимает и обрабатывает платежи. Публичное описание дополнительно подтверждает 
    централизованное хранение reference/master data в базе данных портала. Исторический нормативно-operational source 
    2015 года подтверждает Oracle-based persistence/replication topology на ту дату, но не идентифицирует current core 
    processing component и не доказывает текущую physical persistence topology.
  priority: important
  status: open
  related_facts:
  - FACT-GPP-008
  - FACT-GPP-021
  - FACT-GPP-026
  - FACT-GPP-027
- id: Q-CUR-001
  area: currentness
  question_ru: Какие из модулей, описанных функциональной спецификацией 05.05.2023, остаются в текущем production state и
    в каком виде?
  reason_ru: WebPortal и mobile app подтвержденно прекращены в 2024 году, system-level обработка платежей подтверждена за
    2025 год, а текущий сайт CBA продолжает описывать GPP<->IPS integration. Это не подтверждает component-level continuity
    named modules 2023 года, включая то, что current implementation по-прежнему использует именно IPSClient.
  priority: important
  status: open
  related_sources:
  - SRC-FS-001
  - SRC-FS-002
  - SRC-PUB-005
  - SRC-OPS-001
  - SRC-PUB-006
  related_facts:
  - FACT-GPP-003
  - FACT-GPP-008
  - FACT-GPP-020
- id: Q-EXT-001
  area: external-systems
  question_ru: Обозначают ли XÖHK и XÖHKS одну внешнюю систему?
  reason_ru: Разные написания встречаются в описании Loader Generators и LVPCSS и влияют на нормализацию 
    context/interface model.
  priority: important
  status: resolved
  resolution_ru: Да. По stakeholder confirmation XÖHK является опечаткой и должен нормализоваться как XÖHKS.
  related_evidence:
  - EV-STK-002
  related_facts:
  - FACT-GPP-016
- id: Q-EXT-002
  area: external-systems
  question_ru: Следует ли IAMAS и AVIS считать внешними системами GPP?
  reason_ru: Спецификация использует их как identification Source, но формальная system boundary не описана.
  priority: important
  status: resolved
  resolution_ru: Да. Публичная страница CBA прямо идентифицирует IAMAS и AVIS как внешние государственные информационные
    системы, а integration contract 2025 подтверждает real-time web-service calls HÖP -> IAMAS/AVIS. Созданы IF-GPP-013 
    и IF-GPP-014 с interface_type unknown; точный GPP component, protocol, payload и contract остаются неизвестными.
  related_assumptions:
  - ASM-EXT-001
  related_sources:
  - SRC-PUB-001
  - SRC-FS-001
  - SRC-FS-002
  - SRC-STK-001
  related_evidence:
  - EV-PUB-009
  related_facts:
  - FACT-GPP-019
- id: Q-ID-001
  area: identification-management
  question_ru: 'Как в текущей реализации организовано управление identification types: централизованно или через повторяющиеся
    organization properties, и должны ли GetOnlineStatementsAfterIAMAS/AVIS-подобные настройки быть связаны с конкретным identification
    type?'
  reason_ru: Reviewer comments указывают на дублирование configuration и риск ошибок при раздельных properties. Более актуального
    подтверждения пока нет.
  priority: important
  status: resolved
  related_evidence:
  - EV-FS-020
  - EV-FS-026
  resolution_ru: 'На дату specification 2023 используются оба механизма: AdminConsole имеет отдельное централизованное управление
    identification types (SC/IAMAS/AVIS; ACC/DOC/MIX), а GetOnlineStatementsAfterIAMAS/AVIS существуют как organization-level
    properties для последующего debt lookup. Reviewer предлагает привязать такие properties к identification type, но это
    recommendation, не подтвержденная implementation. Currentness после 2023 покрывается Q-CUR-001.'
  related_facts:
  - FACT-GPP-060
- id: Q-CFG-001
  area: organization-configuration
  question_ru: Используется ли VirtualBranchID в текущей реализации и для каких organization types он действительно необходим?
  reason_ru: 'Назначение property уточнено: он используется для организации без реального филиала и связывает счет с virtual
    branch. Reviewer предлагает удалить property, но current runtime use и точный набор organization types после 2023 не подтверждены.'
  priority: important
  status: open
  related_evidence:
  - EV-FS-021
  - EV-FS-029
  related_facts:
  - FACT-GPP-063
- id: Q-PAY-001
  area: payment-rules
  question_ru: Каков точный precedence MaxPaymentAmount между лимитом организации и максимальной суммой, возвращенной в invoice/debt
    response?
  reason_ru: Источник описывает сравнение лимитов, но reviewer comment требует более точного объяснения взаимодействия с похожими
    properties.
  priority: important
  status: resolved
  related_evidence:
  - EV-FS-021
  - EV-FS-027
  - EV-INT-019
  resolution_ru: 'Functional specification 2023 прямо описывает precedence: сначала учитывается maximum из invoice/debt response,
    затем organization MaxPaymentAmount, применяется меньшее ограничение. Более поздний contract 2025 ввел channel-specific
    maxAllowedAmountForCash/Card/BankAccount; их взаимодействие с organization limit вынесено в Q-PAY-004.'
  related_facts:
  - FACT-GPP-061
  - FACT-GPP-068
- id: Q-SETTLE-001
  area: settlement-reporting
  question_ru: Каков фактический current default IncludeServiceCode и сохраняется ли в текущей реализации документированная
    2023 mapping semantics для BANK_INV_PAY_APUS/DAY_PAYMENTS и MT outputs?
  reason_ru: 'Impact semantics теперь документирована: ServiceCode включается в BANK_INV_PAY_APUS/DAY_PAYMENTS, а MT mapping
    переключается между budgetcode/budgetlevelcode и spBudgetLevelCode. Не закрыт только runtime/current default: default=true
    содержится в reviewer recommendation, а не в authoritative runtime evidence.'
  priority: important
  status: open
  related_evidence:
  - EV-FS-021
  - EV-FS-028
  related_facts:
  - FACT-GPP-062
- id: Q-IPS-001
  area: ips-integration
  question_ru: Каково точное назначение IpsTransitAccountConsent, для каких организаций property применяется и какие модули/flows
    оно изменяет?
  reason_ru: Reviewer comment прямо отмечает недостаточность описания scope и impact; source приводит только частичное объяснение
    TopUp authentication/consent. Cross-source reconciliation показывает, что operational settlement model 2015 года явно
    опиралась на XÖHKS, тогда как IPS появляется отдельным integration concern только в specification 2023; relationship IPS
    к XÖHKS и payment lifecycle не установлен.
  priority: important
  status: resolved
  related_evidence:
  - EV-FS-022
  - EV-FS-030
  resolution_ru: 'На дату specification 2023 IpsTransitAccountConsent используется для TopUp flows через web/mobile/operator
    workplace, когда debtor bank требует consent: выбирается authentication type consent, а property value передается как
    verification code. Отдельная SignedPain001-конфигурация различает XÖHKS и IPS/AÖS варианты юридического payment flow с/без
    payer signature. Current component/runtime continuity остается Q-CUR-001.'
  related_facts:
  - FACT-GPP-064
  - FACT-GPP-072
- id: Q-FEE-001
  area: fees-tax
  question_ru: Сохраняется ли в current implementation документированная 2023 semantics IgnoreServiceFee/IgnoreVatCalculationOnReport
    и как именно fee/VAT отражаются во всех reports и invoice outputs?
  reason_ru: 'Основное назначение уточнено: IgnoreServiceFee исключает организацию из Service_Fee generator, IgnoreVatCalculationOnReport
    меняет расчет payment amount в AdminConsole reports. Однако reviewer comment по report semantics неполон, а current runtime
    behavior после 2023 не подтвержден.'
  priority: important
  status: open
  related_evidence:
  - EV-FS-022
  - EV-FS-031
  related_facts:
  - FACT-GPP-065
- id: Q-PAY-002
  area: invoice-state
  question_ru: Была ли фактически внедрена заявленная замена invoice-archive configuration концепцией Whole_payment и сохраняется
    ли это поведение в current implementation?
  reason_ru: 'Semantics Whole_payment теперь ясна: после полной оплаты statement переводится в Filed, повторная попытка получает
    already-paid из GPP DB без запроса SC. Но пометка удалить прежний archive concept является редакционной и не подтверждает
    deployment/migration.'
  priority: important
  status: open
  related_evidence:
  - EV-FS-017
  - EV-FS-034
  related_facts:
  - FACT-GPP-067
- id: Q-PAY-003
  area: discount-penalty
  question_ru: Используются ли в текущей реализации discount/penalty fields и соответствующие формулы/периоды расчета?
  reason_ru: Specification 2023 сама оставляет вопрос об использовании discount/penalty без ответа. Integration contract 1.16
    от 18.08.2025 по-прежнему содержит penaltyAmount/discountAmount в invoice schema, что подтверждает contract presence,
    но не runtime use, formula execution или configuration currentness.
  priority: important
  status: open
  related_evidence:
  - EV-FS-017
  - EV-FS-035
  - EV-INT-019
  related_facts:
  - FACT-GPP-068
- id: Q-PAY-004
  area: payment-rules
  question_ru: Как в current implementation комбинируются organization MaxPaymentAmount с invoice maxAllowedAmount и channel-specific
    maxAllowedAmountForCash/Card/BankAccount, добавленными в integration contract 2024/2025?
  reason_ru: Базовый precedence organization limit vs invoice maximum документирован в specification 2023, но contract 1.13+
    добавляет отдельные channel-specific maxima и не описывает их место в общей последовательности ограничений.
  priority: important
  status: open
  related_sources:
  - SRC-FS-001
  - SRC-INT-001
  related_evidence:
  - EV-FS-027
  - EV-INT-019
  related_facts:
  - FACT-GPP-061
  - FACT-GPP-068
- id: Q-PSP-001
  area: psp-integration
  question_ru: Какова точная semantics supported_psp_code_list и означает ли она разрешение PSP отправлять payment request
    от имени банка, а не acquiring relationship?
  reason_ru: Reviewer comment явно исправляет потенциальную интерпретацию property; contract-level подтверждения пока нет.
  priority: important
  status: resolved
  related_evidence:
  - EV-FS-023
  - EV-FS-032
  resolution_ru: Specification 2023 прямо описывает supported_psp_code_list как список PSP, которым разрешено отправлять payment
    request от имени банка. При различии psoCode и userID список валидируется; отсутствие PSP для банка приводит к ошибке.
    Reviewer отдельно уточняет, что это не acquiring-bank relationship.
  related_facts:
  - FACT-GPP-066
- id: Q-BIN-001
  area: card-configuration
  question_ru: Где в текущей реализации управляются BIN codes и какая роль имеет право их редактировать?
  reason_ru: 'Формат уточнен: Cardnumber{index} хранит первые шесть цифр карты. Reviewer сообщает, что отдельный functional
    уже существует и предлагает дать CBA employees edit capability, но не называет модуль/экран и не подтверждает фактическую
    current permission model.'
  priority: important
  status: open
  related_evidence:
  - EV-FS-023
  - EV-FS-033
- id: Q-OPS-001
  area: operations
  question_ru: Каковы текущие временные границы операционного/бизнес-дня GPP, окна отчетности и расчетов следующего рабочего
    дня и точная роль XÖHKS в оркестрации относительно BDA?
  reason_ru: Исторические правила 2015 задают 00:00-24:00 и фиксированные next-business-day windows. Более поздний contract
    2025 подтверждает DAY_PAYMENTS/DAY_PAYMENTS_FROM_BANK в конце операционного дня, а BDA 2025 показывает monitoring lifecycle
    planned -> bank -> clearing -> settled -> participant notified и XÖHKS monitoring. Не установлены current day boundary/clock
    windows и точное ownership исполнения settlement/XÖHKS stages.
  priority: important
  status: open
  related_sources:
