- id: Q-OPS-001
  area: operations
  question_ru: Каковы текущие границы operational/business day GPP, next-business-day reporting/settlement windows и 
    сохраняется ли описанная в 2015 году роль XÖHKS в этих расчетах?
  reason_ru: Исторический нормативный регламент задает точные временные окна и последовательность. Stakeholder сообщил, 
    что это последняя переданная редакция правил, но переносить schedule 2015 года в current operations без 
    подтверждения фактического состояния нельзя; спецификация 2023 года подтверждает XÖHKS integration, но не актуальный
    day schedule.
  priority: important
  status: open
  related_sources:
  - SRC-OPS-001
  - SRC-FS-001
  - SRC-FS-002
  - SRC-STK-002
  related_facts:
  - FACT-GPP-024
  - FACT-GPP-015

- id: Q-SEC-001
  area: security-access
  question_ru: Как устроены текущие authentication/authorization и segregation-of-duties для 
    system/security/certificate, participant administrators и operators, включая использование электронных сертификатов,
    MFA и emergency credential handling?
  reason_ru: Правила 2015 года задают certificate + username/password access и раздельные operational roles, а 
    specification 2023 года подтверждает permissions/dual authorization и измененный набор administrative roles. Current
    security control model и сохранение исторических mechanisms не подтверждены.
  priority: important
  status: open
  related_sources:
  - SRC-OPS-001
  - SRC-FS-001
  - SRC-FS-002
  - SRC-STK-002
  related_facts:
  - FACT-GPP-009
  - FACT-GPP-011
  - FACT-GPP-022
  - FACT-GPP-023

- id: Q-BCK-001
  area: backup-recovery
  question_ru: Каковы текущие backup frequency, retention, offsite/offline copy strategy, restore testing и RPO для GPP?
  reason_ru: Правила 2015 года подробно описывают TSM/Oracle backup и archive media process, но эти технологии и 
    retention mechanics являются историческими и требуют current подтверждения.
  priority: important
  status: open
  related_sources:
  - SRC-OPS-001
  - SRC-STK-002
  related_facts:
  - FACT-GPP-025
  - FACT-GPP-027

- id: Q-DR-001
  area: disaster-recovery
  question_ru: Какова текущая production/DR topology GPP, replication model, RTO/RPO, failover trigger и failback 
    procedure?
  reason_ru: Диаграмма и план 2015 года подтверждают three-site topology с Main/Alternative shared-storage cluster и 
    отдельным Backup site, а также часовой threshold перехода в DR. Это сильный historical evidence, но не 
    доказательство current topology или действующих recovery objectives.
  priority: important
  status: open
  related_sources:
  - SRC-OPS-001
  - SRC-STK-002
  related_facts:
  - FACT-GPP-026
  - FACT-GPP-027

- id: Q-INT-001
  area: integration-contract
  question_ru: К каким SOAP operations/services относятся regUnRegDebtNotificationRequest и debtNotificationRequest и 
    каковы направление, callback semantics и endpoint этих debt-notification exchanges?
  reason_ru: SRC-INT-001 содержит фрагменты XSD соответствующих SOAP types и сообщает о функциональности debt 
    notifications, но не предоставляет разделы operations или привязку к service. Выдумывать имена operations или WSDL 
    portType нельзя.
  priority: important
  status: open
  related_sources:
  - SRC-INT-001
  related_evidence:
  - EV-INT-001
  - EV-INT-012
  stakeholder_context_ru: На 17.08.2026 stakeholder не располагает дополнительными ответами; вопрос сохраняется открытым
    и не блокирует продолжение AS-IS.

- id: Q-INT-002
  area: integration-contract
  question_ru: Доступны ли authoritative WSDL artifacts ServiceCompanyWS, GPPPaymentWS и SCVirtualCabinetWS, актуальные 
    endpoint/binding/security details и уточненная редакция контракта сверки, разрешающая выявленные message/schema 
    inconsistencies?
  reason_ru: Человекочитаемый источник позволяет восстановить operations/messages/types и часть metadata endpoint, но 
    URL WSDL не предоставлены как artifacts. В источнике также есть расхождения Content-Type и Msg/Type, wrapper ответа 
    CompletePaymentWithError, описание ответа InitiatePayment и XSD сверки относительно examples.
  priority: important
  status: open
  related_sources:
  - SRC-INT-001
  related_evidence:
  - EV-INT-006
  - EV-INT-015
  - EV-INT-016
  - EV-INT-017
  - EV-INT-018
  stakeholder_context_ru: На 17.08.2026 stakeholder не располагает authoritative WSDL/endpoint/schema clarification; все
    связанные неопределенности контракта сохраняются как явные UNKNOWN/unverified/contradiction и не блокируют snapshot.
