questions:
- id: Q-SCOPE-001
  area: scope
  question_ru: Где проходит подтвержденная системная граница GPP относительно банков, PSP, государственных органов, 
    поставщиков массовых услуг и иных подключенных систем?
  reason_ru: Boundary влияет на component/context model, ownership и классификацию interfaces.
  priority: important
  status: resolved
  related_assumptions:
  - ASM-SCOPE-001
  resolution_ru: Для рабочей AS-IS boundary именованные infrastructure modules из функциональной спецификации считаются 
    внутренними элементами GPP, а participant organizations и внешние payment/settlement systems - внешними сторонами. 
    Неназванные внутренние core components остаются отдельной неизвестностью Q-ARCH-001.
  related_sources:
  - SRC-FS-001
  - SRC-FS-002

- id: Q-VND-001
  area: vendor-ownership
  question_ru: Какова текущая роль SINAM в сопровождении, развитии или эксплуатации GPP?
  reason_ru: Публичный сайт SINAM подтверждает историческое участие в разработке, но не подтверждает текущую роль. 
    Ожидается отдельный документ по сопровождению, который должен иметь более высокий приоритет для ответа.
  priority: important
  status: open
  related_sources:
  - SRC-PUB-004

- id: Q-SRC-001
  area: source-versioning
  question_ru: Являются ли SRC-FS-001 и SRC-FS-002 независимыми рабочими документами или редакциями одной версии, и 
    какая редакция authoritative/current?
  reason_ru: Внутренняя metadata совпадает. Stakeholder сообщает, что DOCX v005 был передан позже и является более 
    полным, но это не доказывает version authority и допускает независимое происхождение документов.
  priority: important
  status: open
  related_sources:
  - SRC-FS-001
  - SRC-FS-002
  - SRC-STK-001
  stakeholder_context_ru: DOCX filename v005 был передан позже PDF и воспринимается как более полный; возможная 
    независимость документов остается рабочей гипотезой.

- id: Q-ARCH-001
  area: architecture
  question_ru: Какие компоненты реализуют центральную обработку платежей, состояние счетов/инвойсов и persistence, если 
    они не названы в перечне infrastructure modules?
  reason_ru: Система как целое принимает и обрабатывает платежи. Публичное описание дополнительно подтверждает 
    централизованное хранение reference/master data в базе данных портала. Исторический нормативно-operational source 
    2015 года подтверждает Oracle-based persistence/replication topology на ту дату, но не идентифицирует current core 
    processing component и не доказывает текущую physical persistence topology.
  priority: important
  status: open
  related_facts:
  - FACT-GPP-008
  - FACT-GPP-021
  - FACT-GPP-026
  - FACT-GPP-027

- id: Q-CUR-001
  area: currentness
  question_ru: Какие из модулей, описанных функциональной спецификацией 05.05.2023, остаются в текущем production state 
    и в каком виде?
  reason_ru: WebPortal и mobile app подтвержденно прекращены в 2024 году, а system-level обработка платежей через GPP 
    подтверждена за 2025 год. Исторический source 2015 года добавляет deployment, security и technology context, но не 
    повышает currentness этих деталей. Для остальных named modules и operational mechanisms актуальность после дат их 
    источников по-прежнему не подтверждена.
  priority: important
  status: open
  related_sources:
  - SRC-FS-001
  - SRC-FS-002
  - SRC-PUB-005
  - SRC-OPS-001
  related_facts:
  - FACT-GPP-003
  - FACT-GPP-008
  - FACT-GPP-020

- id: Q-EXT-001
  area: external-systems
  question_ru: Обозначают ли XÖHK и XÖHKS одну внешнюю систему?
  reason_ru: Разные написания встречаются в описании Loader Generators и LVPCSS и влияют на нормализацию 
    context/interface model.
  priority: important
  status: resolved
  resolution_ru: Да. По stakeholder confirmation XÖHK является опечаткой и должен нормализоваться как XÖHKS.
  related_evidence:
  - EV-STK-002
  related_facts:
  - FACT-GPP-016

- id: Q-EXT-002
  area: external-systems
  question_ru: Следует ли IAMAS и AVIS считать внешними системами GPP?
  reason_ru: Спецификация использует их как identification Source, но формальная system boundary не описана.
  priority: important
  status: resolved
  resolution_ru: Да. Публичная страница CBA прямо идентифицирует IAMAS и AVIS как внешние государственные информационные
    системы, а integration contract 2025 подтверждает real-time web-service calls HÖP -> IAMAS/AVIS. Созданы IF-GPP-013 
    и IF-GPP-014 с interface_type unknown; точный GPP component, protocol, payload и contract остаются неизвестными.
  related_assumptions:
  - ASM-EXT-001
  related_sources:
  - SRC-PUB-001
  - SRC-FS-001
  - SRC-FS-002
  - SRC-STK-001
  related_evidence:
  - EV-PUB-009
  related_facts:
  - FACT-GPP-019

- id: Q-ID-001
  area: identification-management
  question_ru: 'Как в текущей реализации организовано управление identification types: централизованно или через повторяющиеся
    organization properties, и должны ли GetOnlineStatementsAfterIAMAS/AVIS-подобные настройки быть связаны с конкретным identification
    type?'
  reason_ru: Reviewer comments указывают на дублирование configuration и риск ошибок при раздельных properties. Более 
    актуального подтверждения пока нет.
  priority: important
  status: open
  related_evidence:
  - EV-FS-020

- id: Q-CFG-001
  area: organization-configuration
  question_ru: Используется ли VirtualBranchID в текущей реализации и для каких organization types он действительно 
    необходим?
  reason_ru: Reviewer comment предлагает отказаться от property, но source одновременно описывает его назначение для 
    организаций без real branch.
  priority: important
  status: open
  related_evidence:
  - EV-FS-021

- id: Q-PAY-001
  area: payment-rules
  question_ru: Каков точный precedence MaxPaymentAmount между лимитом организации и максимальной суммой, возвращенной в 
    invoice/debt response?
  reason_ru: Источник описывает сравнение лимитов, но reviewer comment требует более точного объяснения взаимодействия с
    похожими properties.
  priority: important
  status: open
  related_evidence:
  - EV-FS-021

- id: Q-SETTLE-001
  area: settlement-reporting
  question_ru: Как IncludeServiceCode влияет на MT/file outputs и какой default value является фактическим для текущей 
    реализации?
  reason_ru: Reviewer comment требует уточнить связь property с MT и утверждает необходимость default=true; 
    authoritative semantics пока не подтверждены.
  priority: important
  status: open
  related_evidence:
  - EV-FS-021

- id: Q-IPS-001
  area: ips-integration
  question_ru: Каково точное назначение IpsTransitAccountConsent, для каких организаций property применяется и какие 
    модули/flows оно изменяет?
  reason_ru: Reviewer comment прямо отмечает недостаточность описания scope и impact; source приводит только частичное 
    объяснение TopUp authentication/consent. Cross-source reconciliation показывает, что operational settlement model 
    2015 года явно опиралась на XÖHKS, тогда как IPS появляется отдельным integration concern только в specification 
    2023; relationship IPS к XÖHKS и payment lifecycle не установлен.
  priority: important
  status: open
  related_evidence:
  - EV-FS-022

- id: Q-FEE-001
  area: fees-tax
  question_ru: Каковы фактические текущие semantics IgnoreServiceFee и IgnoreVatCalculationOnReport, включая влияние на 
    generators, reports и invoice generation?
  reason_ru: Reviewer comments уточняют/оспаривают текст спецификации, а одна из формулировок отмечена как непонятная.
  priority: important
  status: open
  related_evidence:
  - EV-FS-022

