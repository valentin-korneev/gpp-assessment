  notes_ru: 'Внутреннее название - Verilənlər Bazasının təsviri; имя файла описывает другой тип документа и не используется
    как источник названия. История версий заканчивается version 003 от 09.06.2015 с добавлением схемы APUS. В DOCX есть один
    незакрытый reviewer comment от 04.11.2015 по полю PREFIXED, поэтому уверенность в версии снижена до medium: комментарий
    является более поздней аннотацией, но не новой подтвержденной версией. Физические таблицы и Oracle-специфичные типы извлечены
    отдельно для CF и APUS. Ни одна структура 2015 года не считается автоматически текущей производственной схемой. Из-за
    ожидаемой ограниченности дальнейшей документации введен отдельный слой logical FK: documented semantic references и архитектурно
    обоснованные INFERENCE-связи хранятся отдельно от подтвержденных физических FK и не считаются Oracle constraints. По сообщению
    stakeholder на 17.08.2026 это, вероятно, наиболее актуальная документация по physical DB model в переданном source set;
    этот source-set status не повышает temporal currentness и не подтверждает production schema 2026 года.'
