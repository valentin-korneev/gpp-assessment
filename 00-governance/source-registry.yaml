- id: gpp-functional-specification-2023
  title_ru: Функциональное описание GPP - семейство рабочих редакций
  relationship_ru: Два сильно перекрывающихся внутренних артефакта с неоднозначным relationship. Имена файлов содержат
    hints v005 и v006, но оба файла внутри идентифицируют документ как GPP_System Functional Specification_v001,
    историю версии 0.01 и дату 05.05.2023. По сообщению архитектора assessment, DOCX с filename hint v005 был передан
    позже и является более полным по содержанию; одновременно сохраняется рабочая гипотеза, что артефакты могут
    быть независимыми рабочими документами, а не последовательными версиями. Эти сведения не доказывают authoritative/current
    precedence. Shared content используется без дублирования facts, delta сохраняется source-specific.
  sources:
  - SRC-FS-001
  - SRC-FS-002
  - SRC-STK-001
  precedence: unresolved
  relationship_classification: ambiguous-overlap
  stakeholder_context_source: SRC-STK-001

