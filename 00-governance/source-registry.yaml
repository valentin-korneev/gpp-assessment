- id: gpp-functional-specification-2023
  title_ru: Функциональное описание GPP - семейство рабочих редакций
  relationship_ru: Два сильно перекрывающихся внутренних артефакта с неоднозначным relationship. Имена файлов содержат 
    hints v005 и v006, но оба файла внутри идентифицируют документ как GPP_System Functional Specification_v001, историю
    версии 0.01 и дату 05.05.2023. По сообщению архитектора assessment, DOCX с filename hint v005 был передан позже и 
    является более полным по содержанию; одновременно сохраняется рабочая гипотеза, что артефакты могут быть 
    независимыми рабочими документами, а не последовательными версиями. Эти сведения не доказывают authoritative/current
    precedence. Shared content используется без дублирования facts, delta сохраняется source-specific.
  sources:
  - SRC-FS-001
  - SRC-FS-002
  - SRC-STK-001
  precedence: unresolved
  relationship_classification: ambiguous-overlap
  stakeholder_context_source: SRC-STK-001
- id: gpp-normative-operational-2015
  title_ru: Правила проведения операций через GPP - нормативно-операционный baseline 2015
  relationship_ru: Утвержденные Правлением Центрального банка правила с приложениями по ежедневным операциям, резервному
    копированию и аварийному восстановлению. Используются как нормативный, организационный и исторический operational 
    source. Технологии, инфраструктура и процедуры 2015 года не считаются current AS-IS без более нового подтверждения.
  sources:
  - SRC-OPS-001
  - SRC-STK-002
  stakeholder_context_source: SRC-STK-002
- id: gpp-integration-contract-2025
  title_ru: Техническая спецификация интеграции сервисных организаций с HÖP - семейство контрактов 2025
  relationship_ru: Версия 1.16 от 18.08.2025 является предоставленным человекочитаемым интеграционным контрактом. 
    Документ содержит примеры SOAP-сообщений и фрагменты XSD, а также отдельный HTTP/XML-контракт сверки. Указанные в 
    тексте URL WSDL не являются предоставленными WSDL artifacts и учитываются только как ссылки на ресурсы со статусом 
    referenced-unavailable или referenced-unverified.
  sources:
  - SRC-INT-001
- id: gpp-physical-data-model-2015
  title_ru: Физическая модель данных GPP - baseline 2015
  relationship_ru: Отдельное техническое приложение к концепции развития GPP. Документирует физические структуры CF 
    Transaction DB и APUS Reporting DB. По времени пересекается с operational rules 2015, но не относится к той же 
    source family. Более поздние функциональные и интеграционные источники используются только для концептуальной сверки
    и не подтверждают сохранение этой физической схемы.
  sources:
  - SRC-DB-001
  - SRC-STK-003
- id: gpp-bda-operational-day-2025
  title_ru: BDA - управление операционным днем GPP, функциональный и технический слой
  relationship_ru: Пользовательское руководство от 10.03.2025 задает функциональную и интерфейсную сторону BDA, а 
    техническая спецификация версии 0.0.2 от 02.04.2025 документирует REST API, модели API и физические таблицы схем 
    BDA/BDA_ARCHIVE. Технический источник накладывается на функциональную модель без обратного приписывания руководству 
    пользователя неописанной семантики API/БД. Чувствительные примеры из технической спецификации в канонические 
    артефакты не переносятся.
  sources:
  - SRC-BDA-001
  - SRC-BDA-002
