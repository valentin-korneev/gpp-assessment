- id: DATA-GPP-007
  name: SettlementAccount
  name_ru: Расчетный банковский счет
  description_ru: Банковский счет организации-участника, выбираемый через BankAccount{index} для settlement по payment receiver.
  evidence:
  - EV-FS-025
  status: active
  temporal_scope:
    source_date: '2023-05-05'
    currentness: current-at-source-date
  relationships:
  - type: belongs-to
    target: DATA-GPP-001
- id: DATA-GPP-008
  name: InvoiceStatement
  name_ru: Инвойс / запись задолженности
  description_ru: Объект задолженности/инвойса, для которого источник описывает частичную/полную оплату и переходы statement
    status Filed/UnFiled.
  evidence:
  - EV-FS-024
  status: active
  temporal_scope:
    source_date: '2023-05-05'
    currentness: current-at-source-date
  limitations_ru: Текущая физическая модель хранения не подтверждена. SRC-DB-001 документирует historical 2015 STATEMENT_EXT
    и invoice/statement fields внутри PAYMENT_DATA; это не подтверждает current schema и не означает тождество domain entity
    одной таблице.
  relationships:
  - type: settled-by
    target: DATA-GPP-009
- id: DATA-GPP-009
  name: Payment
  name_ru: Платеж
  description_ru: Платежная операция, для которой конфигурация service type определяет возможность advance/partial/full payment
    и cancellation.
  evidence:
  - EV-FS-024
  status: active
  temporal_scope:
    source_date: '2023-05-05'
    currentness: current-at-source-date
  relationships:
  - type: for-service
    target: DATA-GPP-004
  - type: may-settle
    target: DATA-GPP-008
  limitations_ru: SRC-DB-001 дает historical physical mappings PAYMENT_DATA/PAYMENT_EXT/PAYMENT_NOTIFICATION и APUS aggregate,
    но current 2026 tables/constraints не подтверждены; domain entity не отождествляется с одной physical table.
- id: DATA-GPP-010
  name: BDAProcessDefinition
  name_ru: Определение процесса BDA
  description_ru: Конфигурационный объект BDA с именем, типом, command и набором параметров; может изменяться и удаляться
    администратором.
  evidence:
  - EV-BDA-002
  - EV-BDA-003
  status: active
  temporal_scope:
    source_date: '2025-03-10'
    currentness: current-at-source-date
  relationships:
  - type: has
    target: DATA-GPP-011
