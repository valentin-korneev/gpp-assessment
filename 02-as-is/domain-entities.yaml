  status: active
  temporal_scope:
    source_date: '2025-03-10'
    currentness: current-at-source-date
  relationships:
  - type: instance-of
    target: DATA-GPP-010
  - type: uses
    target: DATA-GPP-011
  - type: may-have
    target: DATA-GPP-015
- id: DATA-GPP-015
  name: BDAProcessXmlArtifact
  name_ru: XML-артефакт процесса BDA
  description_ru: XML artifact, доступный для загрузки из details process как для текущего, так и для archived operational
    day.
  evidence:
  - EV-BDA-006
  - EV-BDA-008
  status: active
  temporal_scope:
    source_date: '2025-03-10'
    currentness: current-at-source-date
  limitations_ru: Источник не определяет формат XML, момент его генерации, storage ownership или является ли artifact input/output
