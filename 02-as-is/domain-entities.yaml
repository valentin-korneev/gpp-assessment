    payment и cancellation.
  evidence:
  - EV-FS-024
  status: active
  temporal_scope:
    source_date: '2023-05-05'
    currentness: current-at-source-date
  relationships:
  - type: for-service
    target: DATA-GPP-004
  - type: may-settle
    target: DATA-GPP-008
  limitations_ru: SRC-DB-001 дает historical physical mappings PAYMENT_DATA/PAYMENT_EXT/PAYMENT_NOTIFICATION и APUS 
    aggregate, но current 2026 tables/constraints не подтверждены; domain entity не отождествляется с одной physical 
    table.
