components:
- id: CMP-GPP-001
  name: WebPortal
  subsystem_ru: Пользовательские каналы
  responsibility_ru: Интернет-портал для online payments, регистрации, personal cabinet и истории платежей.
  evidence:
  - EV-FS-002
  - EV-PUB-003
  status: superseded
  temporal_scope:
    source_date: '2023-05-05'
    currentness: historical
  notes_ru: Собственный web channel прекращен с 10.01.2024.

- id: CMP-GPP-002
  name: WebPortalVC
  subsystem_ru: Каналы participant organizations
  responsibility_ru: Virtual Cabinet / механизм, позволяющий integrated service organizations использовать свои
    internet resources для сбора платежей в GPP infrastructure.
  evidence:
  - EV-FS-002
  status: active
  temporal_scope:
    source_date: '2023-05-05'
    currentness: current-at-source-date

- id: CMP-GPP-003
  name: PacPmtProc
  subsystem_ru: Авторизация платежей
  responsibility_ru: Информационный обмен с payment authorization centers и обработка authorization requests для
    payment instruments.
  evidence:
  - EV-FS-002
  - EV-FS-015
  status: active
  temporal_scope:
    source_date: '2023-05-05'
    currentness: current-at-source-date

- id: CMP-GPP-004
  name: Mobile applications (Android/iOS)
  subsystem_ru: Пользовательские каналы
  responsibility_ru: Мобильный клиент с функциональностью зарегистрированного пользователя WebPortal.
  evidence:
