- id: CMP-GPP-012
  name: BDA / Əməliyyat gününün idarə olunması modulu
  subsystem_ru: Администрирование операционного дня
  responsibility_ru: Административный модуль для настройки определений процессов и шаблонов, создания и управления 
    операционным днем, запуска и отслеживания процессов дня, просмотра архива и операционного мониторинга XÖHKS, 
    платежей, файлов и MT.
  evidence:
  - EV-BDA-001
  - EV-BDA-002
  - EV-BDA-004
  - EV-BDA-005
  - EV-BDA-006
  - EV-BDA-008
  - EV-BDA-009
  - EV-BDA-013
  - EV-BDA-014
  - EV-BDA-016
  - EV-BDA-017
  - EV-BDA-019
  - EV-BDA-020
  - EV-BDA-021
  status: active
  temporal_scope:
    source_date: '2025-04-02'
    currentness: current-at-source-date
  notes_ru: Руководство пользователя и техническая спецификация подтверждают функциональный контур интерфейса, REST API 
    и физические схемы BDA/BDA_ARCHIVE. Точное отношение к AdminConsole, единицы клиентского/серверного развертывания и 
    владение command-runner/механизмом исполнения остаются UNKNOWN (Q-BDA-001). Поставщики данных мониторинга и хранение
    XML-артефактов также не доказаны.
  interfaces:
  - IF-GPP-015
  persistence_models:
  - DB-BDA-001
