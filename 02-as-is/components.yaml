  evidence:
  - EV-FS-015
  status: active
  temporal_scope:
    source_date: '2023-05-05'
    currentness: current-at-source-date

- id: CMP-GPP-011
  name: IPSClient
  subsystem_ru: Интеграция с расчетными системами
  responsibility_ru: Информационный обмен с системой мгновенных платежей.
