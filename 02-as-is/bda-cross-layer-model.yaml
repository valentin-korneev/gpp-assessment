functional_layer:
  actors:
  - key: central-bank-administrator
    name_ru: Администратор Центрального банка
    type: human
    evidence:
    - EV-BDA-001
    - EV-BDA-015
    responsibilities_ru:
    - Вход в административный интерфейс BDA.
    - Управление определениями процессов и шаблонами.
    - Создание и управление жизненным циклом операционного дня.
    - Запуск и контроль процессов операционного дня.
    - Просмотр архива и мониторинга.
  functional_surfaces:
  - Процессы
  - Шаблоны
  - Операционные дни
  - Архив
  - Мониторинг
  capabilities:
  - CAP-ASIS-014
  - CAP-ASIS-015
  - CAP-ASIS-016
  - CAP-ASIS-017
  - CAP-ASIS-018
  - CAP-ASIS-019
  - CAP-ASIS-020
  entities:
  - DATA-GPP-010
  - DATA-GPP-011
  - DATA-GPP-012
  - DATA-GPP-013
  - DATA-GPP-014
  - DATA-GPP-015
  configuration_chain:
  - step: 1
    object: DATA-GPP-010
    action_ru: Создать/изменить определение процесса с типом, командой и параметрами.
    evidence:
    - EV-BDA-002
    - EV-BDA-018
  - step: 2
    object: DATA-GPP-012
    action_ru: Собрать шаблон из выбранных процессов и переопределить значения параметров.
    evidence:
    - EV-BDA-004
    - EV-BDA-017
    - EV-BDA-018
  - step: 3
    object: DATA-GPP-013
    action_ru: Создать операционный день из выбранного шаблона.
    evidence:
    - EV-BDA-005
    - EV-BDA-014
  - step: 4
    object: DATA-GPP-014
    action_ru: Настроить параметры экземпляра процесса, добавить/упорядочить процессы и запускать выполнение с фиксацией
      трассы.
    evidence:
    - EV-BDA-006
    - EV-BDA-016
    - EV-BDA-017
  operational_day_workflow:
    states:
    - id: current
      source_literal: Cari
      technical_value: CURRENT
      mapping_assertion: inference
      evidence:
      - EV-BDA-007
      - EV-BDA-020
    - id: closed
      source_literal: Bağlanmış
      technical_value: CLOSED
      mapping_assertion: inference
      evidence:
      - EV-BDA-007
      - EV-BDA-020
    - id: archived
      source_literal: Arxiv
      technical_representation: схема BDA_ARCHIVE
      mapping_assertion: supported
      evidence:
      - EV-BDA-008
      - EV-BDA-019
    actions_ru:
    - Создать из шаблона
    - Открыть список процессов
    - Переименовать/обновить
    - Удалить
    - Закрыть
    - Архивировать
    archive_precondition_ru: Все процессы операционного дня должны быть завершены.
    archive_precondition_evidence:
    - EV-BDA-005
    process_execution:
      editable_parameter_values: true
      start_action: true
      add_process_action: true
      process_order_persisted: true
      trace_fields:
      - start_time
      - executor
      - status
      - end_time
      statuses:
      - ui_literal: İcradadır
        technical_value: IN_PROGRESS
        assertion: inference
      - ui_literal: Tamamlanıb
        technical_value: DONE
        assertion: inference
      - ui_literal:
        technical_value: HAS_ERROR
        assertion: fact-technical-only
      start_semantics: asynchronous-response-message
      xml_artifact_download_or_export: true
      evidence:
      - EV-BDA-006
      - EV-BDA-016
      - EV-BDA-020
  archive_scenarios:
    scenarios_ru:
    - Открыть архивированный операционный день и просмотреть его процессы.
    - Открыть детальную информацию архивированного процесса.
    - Экспортировать артефакт/файл архивированного процесса.
    evidence:
    - EV-BDA-008
    - EV-BDA-014
    - EV-BDA-019
  monitoring_scenarios:
  - id: xohks-files
    name_ru: Мониторинг файлов XÖHKS
  - id: xohks-successful-payments
    name_ru: Мониторинг успешных платежей XÖHKS
  - id: previous-current-day-payments
    name_ru: Мониторинг платежей между предыдущим и текущим операционными днями
  - id: unsent-files
    name_ru: Мониторинг файлов, которые не удалось отправить
  - id: mt-files
    name_ru: Мониторинг MT-файлов
  functional_boundaries:
    inside_confirmed_ru:
    - Управление определениями процессов и параметрами.
    - Композиция шаблонов и переопределение параметров.
    - Управление жизненным циклом операционного дня.
    - Запуск процессов дня и наблюдение за состоянием выполнения.
    - Просмотр архива и экспорт артефактов процессов.
    - Операционный мониторинг XÖHKS, платежей, файлов и MT.
    not_proven_ru:
    - Владение BDA механизмом исполнения обработки и расчетов платежей.
    - Владение BDA механизмом транспорта XÖHKS/файлов.
    - Точное размещение command-runner/механизма исполнения команд.
    - Физическое хранение XML-артефактов.
    - Точное отношение к AdminConsole.
    - Полный авторитетный каталог процессов/команд.
