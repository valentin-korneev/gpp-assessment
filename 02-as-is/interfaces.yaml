  notes_ru: Источник документирует ссылку на WSDL, но не подтверждает отдельный service endpoint для реализации на 
    стороне XT. Binding/service/endpoint не реконструируются как факт.

- id: IF-GPP-010
  name: HÖP - callback завершения платежа сервисной организации - SCVirtualCabinetWS
  interface_type: soap
  from_system: GPP
  to_external: Сервисная организация (XT)
  direction: HÖP -> XT
  interaction_mode: real-time-callback
  process_semantics: асинхронное завершение InitiatePayment из IF-GPP-008
  operations:
  - CompletePayment
  - CompletePaymentWithError
  correlation:
    field: transactionID
    scope: payment-process
  evidence:
  - EV-INT-006
  - EV-INT-007
  - EV-INT-008
  status: active
  temporal_scope:
    source_date: '2025-08-18'
    currentness: current-at-source-date
  contract_source:
    status: referenced-unavailable
    reference: https://gpp.az/wsdls/sc/vircab/1.0.3/SCVirtualCabinetWS.xml
  endpoint_reference:
    status: not-referenced
  normalized_contract: NORM-SOAP-003
  notes_ru: XT должен реализовать server side этого SOAP interface. SOAP callback имеет request/ack semantics; retry 
    policy не документирована. Wrapper response CompletePaymentWithError в источнике неоднозначен и отражен в 
    CONTR-INT-002.

- id: IF-GPP-011
  name: HÖP - сверка с сервисной организацией - платежная информация XML
  interface_type: http-xml
  from_system: GPP
  to_external: Сервисная организация (XT)
  direction: HÖP -> XT
  method: POST
  media_type: application/gpp.message+xml
  message_types:
  - INVOICE_PAY_APUS
  - DAY_PAYMENTS
  - DAY_PAYMENTS_FROM_BANK
  schedule:
    INVOICE_PAY_APUS: configurable-interval-currently-30-seconds-at-source-date
    DAY_PAYMENTS: end-of-HÖP-operational-day
    DAY_PAYMENTS_FROM_BANK: end-of-HÖP-operational-day
  response_semantics:
    body: none-required
    success: HTTP-200-if-processed-or-stored
    retry: any-non-200-resend-on-next-generation
  idempotency_and_identity:
    payment_uniqueness: receiptNumber
    message_reference: UserID-plus-SerialNumber
  evidence:
  - EV-INT-009
  - EV-INT-010
  - EV-INT-011
  status: active
  temporal_scope:
    source_date: '2025-08-18'
    currentness: current-at-source-date
  contract_source:
    status: not-referenced
    inline_schema_evidence: documented-in-human-readable-source
  endpoint_reference:
    status: not-referenced
  normalized_contract: NORM-XML-001
  notes_ru: Этот механизм не является SOAP и не классифицируется как file transport, поскольку источник явно задает HTTP
    POST. Inline XSD предоставлен в документе; несогласованности content-type и schema/examples сохранены как 
    contradictions, а не исправлены молча.

