- id: IF-GPP-008
  name: Интернет-/мобильные ресурсы сервисной организации - GPPPaymentWS
  interface_type: soap
  from_external: Сервисная организация (XT)
  to: CMP-GPP-002
  direction: XT -> HÖP
  interaction_mode: real-time-request-response
  operations:
  - GetAccountInfo
  - InitiatePayment
  - NotifyAboutError
  - GetBankList
  evidence:
  - EV-FS-002
  - EV-INT-006
  - EV-INT-007
  status: active
  temporal_scope:
    source_date: '2025-08-18'
    currentness: current-at-source-date
  contract_source:
    status: referenced-unavailable
    reference: https://gpp.az/wsdls/sc/vircab/1.0.5/GPPPaymentWS.xml
  endpoint_reference:
    status: referenced-unverified
    environment: test
    reference: https://testservices.gpp.az/WebPortalVC/GPPPaymentWS
  normalized_contract: NORM-SOAP-002
  notes_ru: Классификация SOAP подтверждена envelopes и описаниями operations в SRC-INT-001. InitiatePayment имеет 
    синхронный request/response, но завершение платежного процесса приходит отдельным асинхронным callback через 
    IF-GPP-010. URL WSDL не является предоставленным WSDL artifact; production endpoint отсутствует.

