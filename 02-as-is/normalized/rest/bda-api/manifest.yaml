documented_response_semantics:
  common_codes:
  - '200'
  - '400'
  - '401'
  special_codes:
  - operation_id: listTemplates
    code: '404'
    basis_ru: 404 явно приведен только в детальном разделе 2.1.
  error_body_schema: unknown
  export_response_media_type: unknown
  notes_ru: 400 описан как ошибочный ответ, 401 как ошибка аутентификации. Унифицированная оболочка ошибки, семантика 
    403/5xx и повторных попыток не документированы.
source_conflicts_and_gaps:
- topic: Путь получения списка шаблонов
  reconstruction_choice: GET /api/v1/templates
  contradiction_ref: CONTR-BDA-001
- topic: Путь получения процессов операционного дня
  reconstruction_choice: GET /api/v1/period-details/findByOperationId/{operationDayId}
  contradiction_ref: CONTR-BDA-002
- topic: 'Структура модели Parameter: оболочка и дочерний элемент'
  reconstruction_choice: Разделение на ParameterValue и ParameterSet
  contradiction_ref: CONTR-BDA-003
- topic: Имена и типы полей OperationPeriod
  reconstruction_choice: Имена полей из JSON-примеров; operationDayName как строка/дата
  contradiction_ref: CONTR-BDA-004
- topic: Для Parameter.days не документирована колонка БД
  reconstruction_choice: Поле API сохранено; физическое отображение остается UNKNOWN
  contradiction_ref: CONTR-BDA-005
- topic: Тела изменяющих запросов
  status: documentation-gap
- topic: Расположение параметров экспорта и тип содержимого
  status: documentation-gap
- topic: Тела ответов с ошибками
  status: documentation-gap
- topic: Точный способ передачи JWT и его жизненный цикл
  status: unknown
  question: Q-BDA-003
validation_targets:
- Разбор YAML OpenAPI
- 39 уникальных значений operationId
- Все параметры шаблонов путей объявлены
- Все внутренние ссылки $ref разрешаются
- Чувствительные значения из примеров источника отсутствуют
- Межслойные связи не требуют, чтобы каждый workflow доходил до физической таблицы
