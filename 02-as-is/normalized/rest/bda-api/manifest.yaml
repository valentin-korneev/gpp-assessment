reconstruction_policy:
  rule_ru: Документированные HTTP-методы, пути, модели ответов и коды статусов сохраняются. Неописанные тела запросов, 
    тела ошибок, полезная нагрузка/тип экспорта и физическое хранение не выдумываются.
  request_body_policy_ru: Тело запроса добавлено только для login как явный INFERENCE из username/password и 
    application/json; остальные тела изменяющих запросов оставлены как пробел документации.
  authentication_policy_ru: Источник подтверждает выдачу JWT для дальнейшего использования API, но не документирует 
    способ передачи Authorization/Bearer. OpenAPI содержит HTTP Bearer только как явно маркированный INFERENCE.
  sensitive_examples_policy_ru: JWT, команды с учетными данными, внутренние/частные адреса и полезные нагрузки из 
    примеров источника не копируются. Используются заполнители <REDACTED_...>.
