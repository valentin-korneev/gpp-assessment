components:
  securitySchemes:
    jwtBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'INFERENCE: источник подтверждает выдачу JWT для использования остальных API, но не документирует имя заголовка
        или способ передачи Bearer. HTTP Bearer выбран как реконструкция и требует подтверждения.'
      x-assertion: inference
      x-source-gap: Семантика заголовка Authorization/Bearer отсутствует в источнике.
  responses:
    BadRequest:
      description: 400 - ошибочный запрос. Формат тела ошибки источник не документирует.
    Unauthorized:
      description: 401 - ошибка аутентификации. Формат тела ошибки источник не документирует.
    NotFound:
      description: 404 - не найдено. Этот код явно указан только в детальном разделе 2.1.
  schemas:
    ProcessType:
      type: string
      enum:
      - DAY_PAYMENTS
      - DAY_PAYMENTS_FOR_PAC
      - DAY_PAYMENTS_FROM_BANK
      - MT150
      - MT152
      - SERVICE_FEE
      - PAYMENT_SUMMARY_FOR_BENEFICIARY
      - RESEND
      description: Список типов, явно перечисленный в физических таблицах БД PROCESS/OPERATION_PROCESS. Полный каталог 
        не доказан.
      x-source-limitation: История версии 0.0.2 упоминает процессы MX, но физический перечень их явно не перечисляет.
    OperationDayStatus:
      type: string
      enum:
      - CURRENT
      - CLOSED
      description: Значения показаны в примерах API OperationDay; физическая БД описывает открытый/закрытый статус.
    OperationProcessStatus:
      type:
      - string
      - 'null'
      enum:
      - DONE
      - IN_PROGRESS
      - HAS_ERROR
      - 
      description: Значения документированы для BDA.OPERATION_PROCESS.PERIOD_STATUS; пример API допускает null до 
        запуска.
    Period:
      type: object
      additionalProperties: true
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
          description: Идентификатор; присутствует в примерах, но не в таблице полей модели.
        name:
          type: string
        processRunCommand:
          type: string
          description: Команда запуска процесса. Реальные примеры из источника удалены из реконструкции.
          example: <REDACTED_COMMAND>
          x-sensitive-source-example: true
        processType:
          oneOf:
          - $ref: '#/components/schemas/ProcessType'
          - type: string
          description: Тип процесса. Исходная модель задает String; физическая БД приводит неполный известный список.
        processOrder:
          type: integer
          description: Порядок процесса; поле отмечено обязательным в модели Period.
      required:
      - name
      - processRunCommand
      - processType
      - processOrder
    Template:
      type: object
      additionalProperties: true
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        name:
          type: string
        periods:
          type: array
          items:
            $ref: '#/components/schemas/Period'
      required:
      - name
      - periods
    ParameterValue:
      type: object
      additionalProperties: true
      description: Реконструированный дочерний параметр из примеров модели Parameter.
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        parameterName:
          type: string
        parameterValue:
          type: string
        parameterType:
          type: string
        days:
          type: integer
          description: Смещение в днях для параметров типа Date; добавлено в версии 0.0.2.
      required:
      - parameterName
      - parameterValue
      - parameterType
      x-reconstruction-note: Таблица полей 4.3 объединяет поля дочернего элемента с periodId, тогда как JSON-пример 
        содержит оболочку parameters[] + periodId.
    ParameterSet:
      type: object
      additionalProperties: true
      description: Оболочка, показанная в примерах API для операций параметров.
      properties:
        parameters:
          type: array
          items:
            $ref: '#/components/schemas/ParameterValue'
        periodId:
          type:
          - integer
          - 'null'
          format: int64
      required:
      - parameters
      - periodId
      x-assertion: reconstruction-from-example
    OperationDay:
