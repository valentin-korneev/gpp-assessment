constraint_policy:
  physical_pk_fk_status: not-documented
  logical_references_registry: logical-foreign-keys.yaml
  rule_ru: Описание поля как уникального ID или ссылки используется для семантического/логического отображения. 
    Физическое ограничение PK/FK считается UNKNOWN, пока не подтверждено DDL или системным каталогом.
