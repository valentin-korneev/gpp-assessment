capabilities:
- id: CAP-ASIS-001
  name_ru: Централизованный сбор бюджетных и массовых платежей
  statement_ru: GPP предоставляет единую инфраструктуру для электронного сбора бюджетных платежей и платежей за
    массовые услуги.
  evidence:
  - EV-PUB-001
  temporal_scope:
    currentness: unverified

- id: CAP-ASIS-002
  name_ru: Доступ к платежам через интегрированные внешние цифровые каналы
  statement_ru: После прекращения gpp.az и mobile app платежи GPP выполняются через интегрированные интернет- и
    мобильные сервисы банков и небанковских поставщиков платежных услуг.
  evidence:
  - EV-PUB-004
  temporal_scope:
    currentness: current

- id: CAP-ASIS-003
  name_ru: Передача платежной информации и reconciliation с участниками
  statement_ru: Публичное описание CBA предусматривает real-time передачу платежной информации во внутренние системы
    участников и электронную reconciliation по итогам операционного дня.
  evidence:
  - EV-PUB-006
  temporal_scope:
    currentness: unverified

- id: CAP-ASIS-004
  name_ru: Прием, обработка и расчеты по платежам
  statement_ru: GPP как единая платформа принимает и обрабатывает платежи за услуги бюджетных и небюджетных организаций
    и обеспечивает расчеты по выполненным платежам.
  evidence:
  - EV-FS-001
  temporal_scope:
    currentness: current-at-source-date

- id: CAP-ASIS-005
  name_ru: Управление participant organizations
  statement_ru: Администраторы создают и конфигурируют KXM, бюджетные организации, банки, card processing centers,
    service centers и, по DOCX variant, их филиалы/подразделения.
  evidence:
  - EV-FS-004
  - EV-FS-007
  - EV-FS-011
  temporal_scope:
    currentness: current-at-source-date

- id: CAP-ASIS-006
  name_ru: Управление видами услуг и платежными параметрами
  statement_ru: GPP позволяет управлять service/payment types and groups, service codes и параметрами prepayment,
    partial/full payment, settlement и service fee behavior.
  evidence:
  - EV-FS-008
  - EV-FS-012
  temporal_scope:
    currentness: current-at-source-date

- id: CAP-ASIS-007
  name_ru: Управление типами идентификации плательщика
  statement_ru: GPP поддерживает конфигурацию ACC/DOC/MIX identification types и источников SC/IAMAS/AVIS.
  evidence:
  - EV-FS-009
  - EV-FS-013
  temporal_scope:
    currentness: current-at-source-date

- id: CAP-ASIS-008
  name_ru: Управление тарифами service fee
  statement_ru: AdminConsole позволяет задавать service fee tariff rates по организации/филиалу с percentage и min/max
    values.
  evidence:
  - EV-FS-010
  - EV-FS-014
  temporal_scope:
    currentness: current-at-source-date

- id: CAP-ASIS-009
  name_ru: Интеграция электронных каналов PSP
  statement_ru: PaymentService обеспечивает информационный обмен между GPP и электронными каналами банков, почты,
    card processing centers и других payment organizations.
  evidence:
  - EV-FS-015
  temporal_scope:
    currentness: current-at-source-date

- id: CAP-ASIS-010
  name_ru: Авторизация платежных инструментов
  statement_ru: PacPmtProc обрабатывает authorization requests для payment cards, bank accounts и electronic money
    через соответствующие authorization centers.
  evidence:
  - EV-FS-015
  temporal_scope:
    currentness: current-at-source-date

- id: CAP-ASIS-011
  name_ru: Операторский прием платежей
  statement_ru: TellerWP предоставляет automated workplace для операторов банков, почты и других финансовых организаций,
    принимающих GPP payments.
  evidence:
  - EV-FS-002
  temporal_scope:
    currentness: current-at-source-date

- id: CAP-ASIS-012
  name_ru: Отчетность и выгрузка данных для расчетов
  statement_ru: Loader Generators формирует participant reports и settlement-related MT150/152 files; LVPCSS и IPSClient
    обеспечивают обмен с внешними payment systems.
  evidence:
  - EV-FS-015
  temporal_scope:
    currentness: current-at-source-date

- id: CAP-ASIS-013
  name_ru: Административный контроль, аудит и мониторинг
  statement_ru: AdminConsole UI включает reports, payment audit, management tools, security, queries и monitoring,
    а также функции permissions и dual authorization.
  evidence:
  - EV-FS-005
  - EV-FS-006
  temporal_scope:
    currentness: current-at-source-date
