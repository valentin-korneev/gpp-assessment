- id: EV-OPS-007
  source: SRC-OPS-001
  page: 14-15
  section: Əlavə № 3 - disaster recovery procedures
  locator:
    type: process
    value: historical-failover-failback-procedure
  evidence_type: text
  provenance: documented
  statement_ru: Для локального отказа Основного сайта правила описывают автоматическое восстановление работы на
    Альтернативном сайте в cluster mode. Если отказ Основного и Альтернативного сайтов не устраняется в течение одного
    часа, GPP переводится на Резервный сайт в one-site mode с перенаправлением participant traffic; возврат включает
    синхронизацию базы, остановку DR applications, запуск приложений на основном/альтернативном контуре, возврат traffic
    и восстановление Oracle replication. Для потери резервной Oracle database описано восстановление полной копии с
    Основного сайта, синхронизация и перевод в standby.

