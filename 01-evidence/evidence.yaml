  evidence_type: text
  provenance: documented
  statement_ru: Для локального отказа Основного сайта правила описывают автоматическое восстановление работы на Альтернативном
    сайте в cluster mode. Если отказ Основного и Альтернативного сайтов не устраняется в течение одного часа, GPP переводится
    на Резервный сайт в one-site mode с перенаправлением participant traffic; возврат включает синхронизацию базы, остановку
    DR applications, запуск приложений на основном/альтернативном контуре, возврат traffic и восстановление Oracle replication.
