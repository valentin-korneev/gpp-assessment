evidence:
- id: EV-PUB-001
  source: SRC-PUB-001
  section: The Government Payment Portal (GPP)
  locator:
    type: section
    value: purpose-and-goals
  evidence_type: text
  provenance: documented
  statement_ru: CBA описывает GPP как единую платформу для электронного сбора бюджетных платежей и платежей за коммунальные,
    коммуникационные, страховые и другие услуги.

- id: EV-PUB-002
  source: SRC-PUB-002
  section: Payment systems
  locator:
    type: section
    value: national-payment-system-history
  evidence_type: text
  provenance: documented
  statement_ru: CBA указывает, что CISMS был запущен 11.07.2008, а GPP - в 2012 году с использованием инфраструктурных возможностей
    CISMS.

- id: EV-PUB-003
  source: SRC-PUB-003
  section: DİQQƏT!
  locator:
    type: section
    value: channel-discontinuation
  evidence_type: text
  provenance: documented
  statement_ru: CBA сообщает, что с 10.01.2024 работа интернет-страницы gpp.az и мобильного приложения GPP прекращена.

- id: EV-PUB-004
  source: SRC-PUB-003
  section: DİQQƏT!
  locator:
    type: section
    value: replacement-access-channels
  evidence_type: text
  provenance: documented
  statement_ru: После прекращения gpp.az и mobile app платежи GPP можно выполнять через интегрированные интернет- и мобильные
    сервисы банков и небанковских поставщиков платежных услуг.

- id: EV-PUB-005
  source: SRC-PUB-004
  section: Development of the Government Payment Portal (GPP)
  locator:
    type: section
    value: client-project-period
  evidence_type: text
  provenance: documented
  statement_ru: SINAM публикует case study Development of the Government Payment Portal (GPP) с клиентом Central Bank, Republic
    of Azerbaijan и project period 2008.

- id: EV-PUB-006
  source: SRC-PUB-001
  section: The Government Payment Portal (GPP)
  locator:
    type: section
    value: participant-information-and-reconciliation
  evidence_type: text
  provenance: documented
  statement_ru: CBA описывает передачу информации о платежах во внутренние системы участвующих организаций в real time и электронную
    reconciliation по итогам операционного дня; применимость к текущему production state требует подтверждения.

- id: EV-PUB-007
  source: SRC-PUB-001
  section: The Government Payment Portal (GPP)
  locator:
    type: section
    value: closed-telecommunication-network
  evidence_type: text
  provenance: documented
  statement_ru: CBA описывает обмен информацией между участниками GPP через Closed Telecommunication Network с использованием
    электронных сертификатов Bank Certificate Center CBA; текущая применимость не подтверждена.

- id: EV-PUB-008
  source: SRC-PUB-001
  section: The Government Payment Portal (GPP)
  locator:
    type: section
    value: official-internet-resource
  evidence_type: text
  provenance: documented
  statement_ru: Общая страница GPP на сайте CBA утверждает, что некоторые платежи могут выполняться через официальный Internet
    resource GPP, что требует temporal reconciliation с уведомлением 2024 года.

- id: EV-PUB-009
  source: SRC-PUB-001
  section: Hökumət Ödəniş Portalı (HÖP) - Azerbaijani original
  locator:
    type: section
    value: identification-systems
  evidence_type: text
  provenance: documented
  statement_ru: Азербайджанская версия страницы CBA явно называет IAMAS межведомственной автоматизированной
    информационно-поисковой системой Министерства внутренних дел, используемой для идентификации физических лиц,
    а AVIS - автоматизированной налоговой информационной системой Министерства налогов, используемой для идентификации
    индивидуальных предпринимателей и юридических лиц. Текущая организационная принадлежность систем отдельно не подтверждена.

- id: EV-PUB-010
  source: SRC-PUB-005
  page: 8
  section: 2.4. Digər komponentlər
  locator:
    type: section
    value: gpp-2025-processing-volume-and-count
  evidence_type: text
  provenance: documented
  statement_ru: В обзоре цифровых платежей за 2025 год CBA сообщает, что через GPP выполнено 114,4 млн платежей
    на сумму 8,6 млрд манатов; объем платежей вырос на 6,6% к 2024 году, а объем безналичных платежей - на 9,3%.

- id: EV-PUB-011
  source: SRC-PUB-001
  section: The Government Payment Portal (GPP)
  locator:
    type: section
    value: centralized-bank-requisites-and-classifier
  evidence_type: text
  provenance: documented
  statement_ru: CBA описывает централизованное хранение в базе данных портала банковских реквизитов интегрированных
    организаций, а также кодов уровня бюджета, классификации бюджетных доходов и других реквизитов в виде централизованного
    классификатора с автоматическим добавлением этих данных в платежные транзакции; текущая реализация отдельно не подтверждена.

- id: EV-FS-001
  source: SRC-FS-002
  page: 4
  section: 2. Ümumi məlumat
  locator:
    type: section
    value: system-purpose
  evidence_type: text
  provenance: documented
  statement_ru: Функциональная спецификация описывает GPP как единую платформу для приема, обработки и расчетов по платежам
    за услуги бюджетных и небюджетных организаций.

- id: EV-FS-002
  source: SRC-FS-002
  page: 4
  section: 2. Ümumi məlumat
  locator:
    type: section
    value: infrastructure-modules
  evidence_type: text
  provenance: documented
  statement_ru: В составе инфраструктуры GPP перечислены WebPortal, WebPortalVC, PacPmtProc, mobile applications, MobilApi,
    PaymentService, TellerWP (BankPayment), AdminConsole, Loader Generators, LVPCSS и IPSClient.

- id: EV-FS-003
  source: SRC-FS-002
  page: 5
  section: 2. Ümumi məlumat
  locator:
    type: section
    value: adminconsole-role-workplaces
  evidence_type: text
  provenance: documented
  statement_ru: AdminConsole описан как рабочее место администраторов и контролеров, включая администратора Центрального банка,
    администратора участника, bank security administrator, bank controller и KXM administrator.

- id: EV-FS-004
  source: SRC-FS-002
  page: 6
  section: '3.1'
  locator:
    type: section
    value: participant-organization-types
  evidence_type: text
  provenance: documented
  statement_ru: 'В GPP создаются типы участников: KXM, бюджетные организации, банки, card processing centers и service centers;
    источник описывает их роли в приеме платежей.'

- id: EV-FS-005
  source: SRC-FS-002
  page: 7
  section: 3.1.1.1
  locator:
    type: diagram
    value: Şək. 2 Proqramın əsas menyu ekranı
  evidence_type: ui
  provenance: documented
  statement_ru: 'На основном экране AdminConsole визуально представлены функциональные области: отчеты, аудит платежей, инструменты
    управления, безопасность, работа с запросами и мониторинг.'

- id: EV-FS-006
  source: SRC-FS-002
  page: 8
  section: 3.1.1.2
  locator:
    type: diagram
    value: Şək. 3 İştirakçı təşkilatların fəaliyyətinin idarə olunması menyusu
  evidence_type: ui
  provenance: documented
  statement_ru: В меню Management tools визуально представлены функции управления participant organizations, BIN data для
    card processing centers, service fee tariffs, payment/service types and groups, registered payers, permissions, dual authorization
    и identification types.

- id: EV-FS-007
  source: SRC-FS-002
  page: 33
  section: 3.1.2
  locator:
    type: table
    value: Təşkilatın yaradılmasında istifadə olunan sahələrin təsviri
  evidence_type: table
  provenance: documented
  statement_ru: PDF консолидирует поля создания и настройки participant organizations в общую таблицу с признаком применимости
    поля к типу организации.

- id: EV-FS-008
  source: SRC-FS-002
  page: 46
  section: '3.2'
  locator:
    type: table
    value: Tədiyyə növləri və qrupları
  evidence_type: table
  provenance: documented
  statement_ru: GPP поддерживает конфигурацию payment/service types и groups, включая service code, classification, identification
    types, prepayment/partial payment, settlement and fee-related attributes.

- id: EV-FS-009
  source: SRC-FS-002
  page: 50
  section: '3.3'
  locator:
    type: table
    value: İdentifikasiya tiplərinin idarə olunması
  evidence_type: table
  provenance: documented
  statement_ru: GPP поддерживает управление identification types с Source SC/IAMAS/AVIS, типами ACC/DOC/MIX, subtype и правилами
    составной MIX identification.

- id: EV-FS-010
  source: SRC-FS-002
  page: 51
  section: '3.4'
  locator:
    type: table
    value: Xidmət haqqı üzrə tarif dərəcələrinin idarə olunması
  evidence_type: table
  provenance: documented
  statement_ru: GPP предусматривает управление service fee tariff rates по организации и филиалу с процентом, минимальным
    и максимальным значениями.

- id: EV-FS-011
  source: SRC-FS-001
  section: 3.1.2.1.5 / 3.1.2.2.5 / 3.1.2.3.3 / 3.1.2.5.4 / 3.1.2.5.5
  locator:
    type: process
    value: branch-and-subdivision-administration
  evidence_type: text
  provenance: documented
  statement_ru: DOCX подробно описывает создание и администрирование филиалов KXM, бюджетных организаций, банков, service
    center branches и service center departments.

- id: EV-FS-012
  source: SRC-FS-001
  section: 3.2.1-3.2.2
  locator:
    type: process
    value: service-code-and-group-crud
  evidence_type: text
  provenance: documented
  statement_ru: DOCX описывает UI workflows создания, просмотра, изменения и статуса service codes, а также создания и изменения
    service code groups.

- id: EV-FS-013
  source: SRC-FS-001
  section: 3.3.1-3.3.2
  locator:
    type: process
    value: identification-type-crud
  evidence_type: text
  provenance: documented
  statement_ru: DOCX описывает UI workflows создания и изменения простых и составных identification types.

- id: EV-FS-014
  source: SRC-FS-001
  section: 3.4.1
  locator:
    type: process
    value: service-fee-tariff-management
  evidence_type: text
  provenance: documented
  statement_ru: DOCX описывает UI workflow создания и управления service fee tariff rate.

- id: EV-FS-015
  source: SRC-FS-002
  page: 4
  section: 2. Ümumi məlumat
  locator:
    type: section
    value: integration-module-responsibilities
  evidence_type: text
  provenance: documented
  statement_ru: PaymentService обеспечивает информационный обмен с электронными каналами PSP; PacPmtProc обрабатывает authorization
    requests; Loader Generators формирует отчеты и MT150/152 files; LVPCSS взаимодействует с XÖHKS; IPSClient взаимодействует
    с Instant Payment System.

- id: EV-FS-016
  source: SRC-FS-002
  page: 46
  section: 3.1.2
  locator:
    type: field
    value: NotificationRetryRestricted / swiftIbanValidation
  evidence_type: table
  provenance: documented
  statement_ru: В PDF присутствуют configuration fields NotificationRetryRestricted и swiftIbanValidation, которые не найдены
    в DOCX variant при reconciliation.

- id: EV-FS-017
  source: SRC-FS-002
  page: 47
  section: '3.2'
  locator:
    type: field
    value: Qaimənin arxivləndiriliməsi
  evidence_type: table
  provenance: documented
  statement_ru: PDF содержит редакционную пометку о необходимости отменить один из invoice archival concepts и заменить его
    понятием full payment; на следующих страницах также сохранены вопросы о фактическом использовании discount/penalty fields.

- id: EV-FS-018
  source: SRC-FS-001
  section: front matter / Versiyaların tarixçəsi
  locator:
    type: section
    value: document-identification-and-version-history
  evidence_type: text
  provenance: documented
  statement_ru: DOCX внутри идентифицирует документ как GPP_System Functional Specification_v001, указывает дату 05.05.2023
    и единственную запись version history 0.01 от 05.05.2023 с пометкой о первоначальной версии.

- id: EV-FS-019
  source: SRC-FS-002
  page: 1
  section: front matter / Versiyaların tarixçəsi
  locator:
    type: section
    value: document-identification-and-version-history
  evidence_type: text
  provenance: documented
  statement_ru: PDF внутри идентифицирует документ как GPP_System Functional Specification_v001, указывает дату 05.05.2023
    и единственную запись version history 0.01 от 05.05.2023 с пометкой о первоначальной версии.

- id: EV-STK-001
  source: SRC-STK-001
  section: Ответ на Q-SRC-001
  locator:
    type: section
    value: source-family-relationship
  evidence_type: stakeholder-response
  provenance: stakeholder-reported
  statement_ru: Архитектор assessment сообщил, что DOCX с filename hint v005 был передан позже PDF и является более полным
    по содержанию; при этом есть рабочее ощущение, что артефакты могут быть независимыми документами.

- id: EV-STK-002
  source: SRC-STK-001
  section: Ответ по XÖHK/XÖHKS
  locator:
    type: section
    value: terminology-normalization
  evidence_type: stakeholder-response
  provenance: stakeholder-confirmed
  statement_ru: Архитектор assessment подтвердил, что упоминание XÖHK в описании Loader Generators является опечаткой и обозначает
    XÖHKS.

- id: EV-STK-003
  source: SRC-STK-002
  section: Ответ по актуальности редакции operational rules
  locator:
    type: section
    value: latest-provided-operational-rules-edition
  evidence_type: stakeholder-response
  provenance: stakeholder-confirmed
  statement_ru: Архитектор assessment подтвердил, что редакция правил SRC-OPS-001 от 13.08.2015 была передана как последняя
    доступная редакция. Подтверждение относится к комплекту переданных источников и само по себе не устанавливает currentness
    описанных в документе технологий, инфраструктуры и operational procedures.

- id: EV-FS-020
  source: SRC-FS-001
  section: 3.1.2 - organization properties / identification
  locator:
    type: field
    value: Identification types / GetOnlineStatementsAfterIAMAS
  evidence_type: text
  provenance: documented
  statement_ru: Reviewer comments ставят вопросы о дублировании identification fields, необходимости централизовать управление
    identification types и связывать GetOnlineStatementsAfterIAMAS-подобные свойства с выбранным identification type.

- id: EV-FS-021
  source: SRC-FS-001
  section: 3.1.2 - organization properties
  locator:
    type: field
    value: VirtualBranchID / MaxPaymentAmount / IncludeServiceCode
  evidence_type: text
  provenance: documented
  statement_ru: Reviewer comments предлагают проверить необходимость VirtualBranchID, требуют уточнить взаимодействие MaxPaymentAmount
    с другими лимитами и связь IncludeServiceCode с MT output/default semantics.

- id: EV-FS-022
  source: SRC-FS-001
  section: 3.1.2 - organization properties
  locator:
    type: field
    value: IpsTransitAccountConsent / IgnoreServiceFee / IgnoreVatCalculationOnReport
  evidence_type: text
  provenance: documented
  statement_ru: Reviewer comments требуют уточнить назначение и applicability IpsTransitAccountConsent, а также фактическую
    семантику service fee/VAT exclusion properties.

- id: EV-FS-023
  source: SRC-FS-001
  section: 3.1.2.3 - bank properties
  locator:
    type: field
    value: supported_psp_code_list / Cardnumber{index}
  evidence_type: text
  provenance: documented
  statement_ru: Reviewer comments уточняют, что supported_psp_code_list не следует автоматически трактовать как acquiring-bank
    relation, и предлагают управлять BIN codes отдельным функционалом с явной edit responsibility.

- id: EV-FS-024
  source: SRC-FS-002
  page: 47-48
  section: '3.2'
  locator:
    type: table
    value: Tədiyyə növləri və qrupları - payment/invoice behavior fields
  evidence_type: table
  provenance: documented
  statement_ru: Конфигурация service type включает правила advance, partial и full payment, разрешение отмены платежа и semantics
    изменения invoice/statement status.

- id: EV-FS-025
  source: SRC-FS-001
  section: 3.1.2 - Bank rekvizitləri
  locator:
    type: field
    value: BankAccount{index} / payment_receiver
  evidence_type: text
  provenance: documented
  statement_ru: Для participant organization документируется расчетный банковский счет BankAccount{index}; индекс payment
    receiver используется для выбора счета, по которому выполняется settlement.

- id: EV-OPS-001
  source: SRC-OPS-001
  page: 2-7
  section: 2. Anlayışlar; 5. Sistemin təhlükəsizliyinin təmin olunması
  locator:
    type: role
    value: historical-user-and-administrator-roles
  evidence_type: text
  provenance: documented
  statement_ru: Правила 2015 года определяют роли системного администратора, администратора безопасности, оператора и
    администратора участника; раздел распределения функций отдельно выделяет администратора сертификатных сервисов.
    Системный администратор отвечает за широкий operational perimeter, администратор безопасности - за информационную
    безопасность, а администратор сертификатных сервисов - за PKI/сертификаты.

- id: EV-OPS-002
  source: SRC-OPS-001
  page: 3-7
  section: 3. Ümumi tələblər; 5. Sistemin təhlükəsizliyinin təmin olunması
  locator:
    type: process
    value: historical-user-access-control
  evidence_type: text
  provenance: documented
  statement_ru: Для каждого пользователя правила требуют ограниченный индивидуальный набор функций по статусу; вход в этот
    набор функций выполняется с использованием электронного сертификата, затем имени пользователя и пароля. Политика
    сложности/смены паролей задается внутренними актами Центрального банка, а парольные карточки предусматривают отдельное
    хранение в запечатанном виде.

- id: EV-OPS-003
  source: SRC-OPS-001
  page: 4-7
  section: 4. Sistem istifadəçilərinin funksiyaları
  locator:
    type: process
    value: historical-operational-administration
  evidence_type: text
  provenance: documented
  statement_ru: В 2015 году operational administration охватывала обслуживание UNIX/Windows server software, прикладного
    и сервисного ПО, управление правами участников и пользователей, backup/restore Oracle, контроль репликации с резервным
    центром, управление системными компонентами и операционным днем, а также статусы и деятельность участников.

- id: EV-OPS-004
  source: SRC-OPS-001
  page: 8-9
  section: Əlavə № 1 - Hökumət Ödəniş Portalı vasitəsilə gündəlik əməliyyatların aparılması Reqlamenti
  locator:
    type: process
    value: historical-operational-day-and-next-business-day-settlement
  evidence_type: table
  provenance: documented
  statement_ru: Регламент 2015 года задает операционный день 00:00-24:00 с регистрацией платежей и передачей информации
    участникам; на следующий рабочий день предусматривает отправку сводной информации 09:00-10:00, перевод принятых
    платежей через XÖHKS 10:00-13:00 и передачу участникам информации о зачислении на банковские счета 13:00-18:00.
    В течение операционного дня участники также передают изменения payer base/obligations и получают информацию о платежах.

- id: EV-OPS-005
  source: SRC-OPS-001
  page: 10-12
  section: Əlavə № 2 - elektron sənədlərin ehtiyat surətlərinin hazırlanması və saxlanması
  locator:
    type: process
    value: historical-backup-and-archive-policy
  evidence_type: text
  provenance: documented
  statement_ru: Backup/archive policy 2015 года предусматривает автоматические Oracle backups через TSM с еженедельной
    полной копией и промежуточными копиями в остальные дни; operational-day data старше 30 дней переносится из основной
    схемы в архивную и далее во внешнее хранилище. В конце месяца архивные данные записываются в двух экземплярах на DVD или магнитные ленты, а накопленные
    за год носители передаются архивной службе Центрального банка.

- id: EV-OPS-006
  source: SRC-OPS-001
  page: 13
