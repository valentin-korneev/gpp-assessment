contradictions:
- id: CONTR-GPP-001
  area: channels
  statement_ru: Общая страница GPP на сайте CBA продолжает упоминать официальный Internet resource GPP как канал
    платежей, тогда как отдельное уведомление CBA сообщает о прекращении gpp.az и mobile app с 10.01.2024.
  evidence:
  - EV-PUB-003
  - EV-PUB-008
  status: active
  handling_ru: Для текущего AS-IS состояния каналов приоритет отдается специализированному уведомлению о прекращении.
    Утверждение общей страницы сохраняется как temporal/currentness inconsistency и не используется как подтверждение
    текущей доступности собственного web-канала.

- id: CONTR-SRC-001
  area: source-versioning
  statement_ru: Имена файлов функциональной спецификации содержат hints v005 и v006, но оба артефакта внутри идентифицируют
    документ как GPP_System Functional Specification_v001, version history 0.01, date 05.05.2023.
  evidence:
  - EV-FS-018
  - EV-FS-019
  status: active
  handling_ru: Filename order не используется как доказательство precedence. Stakeholder сообщает, что DOCX v005
    был передан позже и является более полным, но это не устраняет противоречие внутренней metadata и не доказывает
    authority. Shared content консолидируется; source-specific delta сохраняется до разрешения Q-SRC-001.
  related_questions:
  - Q-SRC-001
  related_sources:
  - SRC-FS-001
  - SRC-FS-002
  related_evidence:
  - EV-STK-001
