inferences:
- id: INF-ARCH-001
  area: architecture
  statement_ru: AdminConsole выполняет роль централизованного control/configuration plane GPP для административного 
    управления системой.
  based_on_facts:
  - FACT-GPP-009
  - FACT-GPP-011
  - FACT-GPP-012
  - FACT-GPP-013
  evidence:
  - EV-FS-003
  - EV-FS-005
  - EV-FS-006
  - EV-FS-007
  - EV-FS-008
  - EV-FS-009
  - EV-FS-010
  confidence: supported
  status: active
  limitations_ru: Это логическая архитектурная роль, а не утверждение о выделенном physical control-plane deployment или
    отдельном runtime layer.
- id: INF-ARCH-002
  area: architecture
  statement_ru: 'Существенная часть поведения GPP является configuration-driven: organization properties и service-type parameters
    управляют integration, routing, limits, payment state и fee/settlement behavior.'
  based_on_facts:
  - FACT-GPP-012
  - FACT-GPP-013
  - FACT-GPP-017
  - FACT-GPP-018
  evidence:
  - EV-FS-007
  - EV-FS-008
  - EV-FS-024
  - EV-FS-025
  confidence: supported
  status: active
  limitations_ru: Inference не означает, что вся business logic хранится в configuration и не является finding о 
    качестве такой модели.
- id: INF-ARCH-003
  area: administration
  statement_ru: Cross-source evidence 2015 и 2023 годов поддерживает устойчивость administrative/security perimeter GPP 
    - system administration, participant administration, security control и operator-facing functions присутствуют в 
    обеих моделях, хотя exact role names, responsibility boundaries и authentication mechanisms не подтверждены как 
    неизменные.
  based_on_facts:
  - FACT-GPP-009
  - FACT-GPP-011
  - FACT-GPP-012
  - FACT-GPP-022
  - FACT-GPP-023
  evidence:
  - EV-OPS-001
  - EV-OPS-002
  - EV-OPS-003
  - EV-FS-003
  - EV-FS-005
  - EV-FS-006
  confidence: supported
  status: active
  limitations_ru: Inference относится к устойчивости function domains между source dates 2015 и 2023, а не к current 
    2026 role model. Отдельная PKI/certificate-services role 2015 года и точное назначение permissions/dual 
    authorization 2023 года не позволяют построить current RBAC/SoD matrix без дополнительного evidence.
- id: INF-ARCH-004
  area: payment-lifecycle
  statement_ru: 'Cross-source evidence поддерживает логическое разделение payment lifecycle GPP на прием/обработку платежа
    и downstream participant reporting/settlement concerns: operational rules 2015 описывают регистрацию, информирование и
    next-business-day settlement, а specification 2023 выделяет authorization, participant reporting и XÖHKS/IPS integration
    modules.'
  based_on_facts:
  - FACT-GPP-006
  - FACT-GPP-015
  - FACT-GPP-018
  - FACT-GPP-024
  evidence:
  - EV-OPS-004
  - EV-FS-001
  - EV-FS-015
  - EV-PUB-006
  confidence: supported
  status: active
  limitations_ru: Inference не утверждает неизменность sequence, component orchestration или settlement timing после 
    2015/2023 и не идентифицирует неизвестный current core processing component.
- id: INF-ARCH-005
  area: settlement-integration
  statement_ru: 'XÖHKS является устойчивым интеграционным аспектом GPP как минимум между датами источников 2015, 2023 и 2025
    годов: в 2015 году он используется в процедуре расчетов следующего рабочего дня, в 2023 году присутствует в обязанностях
    Loader Generators/LVPCSS, а руководство BDA 2025 года показывает отдельные сценарии мониторинга XÖHKS.'
  based_on_facts:
  - FACT-GPP-015
  - FACT-GPP-024
  - FACT-GPP-048
  evidence:
  - EV-OPS-004
  - EV-FS-015
  - EV-BDA-009
  confidence: supported
  status: active
  limitations_ru: Вывод не подтверждает текущее на 2026 год состояние интеграции XÖHKS, неизменность контрактов 
    MT/файлов или отношение между XÖHKS и IPS. Мониторинг BDA 2025 года подтверждает наблюдаемость этого аспекта, но не 
    владение механизмом расчетов.
