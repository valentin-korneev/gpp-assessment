- id: INF-ARCH-007
  area: bda-configuration-model
  statement_ru: 'Функциональная модель BDA имеет трехуровневую структуру от конфигурации к исполнению: определение процесса
    -> шаблон -> выполнение процесса операционного дня. Шаблон выбирает процессы и переопределяет значения параметров, а операционный
    день создается из выбранного шаблона и содержит исполняемые экземпляры процессов.'
  based_on_facts:
  - FACT-GPP-042
  - FACT-GPP-043
  - FACT-GPP-044
  - FACT-GPP-046
  - FACT-GPP-054
  evidence:
  - EV-BDA-002
  - EV-BDA-004
  - EV-BDA-005
  - EV-BDA-006
  - EV-BDA-017
  confidence: supported
  status: active
  limitations_ru: Технический источник подтверждает хранение контекстов PERIOD/TEMPLATE/OPERATION_DAY, но не описывает 
    версионирование шаблонов/процессов, транзакционную семантику копирования и поведение при изменении определения после
    создания операционного дня.
- id: INF-ARCH-008
  area: bda-boundary
  statement_ru: Наличие мониторинга XÖHKS, платежей, файлов и MT в BDA подтверждает операционную наблюдаемость этих 
    аспектов в административном модуле, но само по себе не доказывает, что BDA реализует обработку платежей, расчеты 
    XÖHKS или доставку файлов как владеющий runtime-компонент.
